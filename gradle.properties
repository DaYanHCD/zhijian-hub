# JVM
# ⚠️ 不要在这里添加 -Dfile.encoding=UTF-8（与「指尖」同一个坑）：
# Windows 代码页是 936(GBK)，而本工程路径含中文。daemon 若用 UTF-8，
# 会以 UTF-8 写出测试 worker 的 @argfile，但 JVM 启动器按平台编码读，中文路径变成乱码，
# 表现为 testDebugUnitTest 必定报 GradleWorkerMain 找不到。源码/资源本身是 UTF-8，无需该参数。
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# 本工程位于含中文的路径下（D:\指尖Hub），
# AGP 默认会因此拒绝构建，必须显式关闭路径检查（与「指尖」一致）。
android.overridePathCheck=true

# compileSdk 36 比当前 AGP 官方声明的更高，压掉那条警告
android.suppressUnsupportedCompileSdk=36

# Kotlin
kotlin.code.style=official
